name: Go

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.0"
          check-latest: true

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Stress core tests
        run: go test ./internal/core -count=100

      - name: Stress queue tests
        run: go test ./internal/queue -count=100

      - name: Stress service tests
        run: go test ./internal/service -count=100

      - name: Stress command tests
        run: go test ./internal/command -count=100

      # Race tests are intentionally deferred until the local Windows setup has cgo/GCC available.
